<script>

  const firebaseConfig = {
    apiKey: "AIzaSyBX5HnyLlYftzm9A_Y6CRkVlL2RCr_oqmg",
    authDomain: "rishi-strength-tracker.firebaseapp.com",
    projectId: "rishi-strength-tracker",
    storageBucket: "rishi-strength-tracker.firebasestorage.app",
    messagingSenderId: "286386676511",
    appId: "1:286386676511:web:a7c7f1c37e11ba7dcb862a",
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  function keySafe(key) {
    return key.replace(/:/g, "_");
  }

  // Mirrors the shape/signature of the old window.storage API, so the app
  // code barely had to change: dbGet returns { value: <jsonString> } or null.
  // Uses the currently signed-in user (set up via the login screen), not an
  // anonymous identity, so data survives even if the browser clears storage.
  window.dbGet = async function (key) {
    const user = auth.currentUser;
    if (!user) return null;
    try {
      const snap = await db.collection("users").doc(user.uid).collection("data").doc(keySafe(key)).get();
      if (!snap.exists) return null;
      return { value: snap.data().value };
    } catch (e) {
      console.error("dbGet failed for", key, e);
      return null;
    }
  };

  window.dbSet = async function (key, jsonString) {
    const user = auth.currentUser;
    if (!user) return null;
    try {
      await db.collection("users").doc(user.uid).collection("data").doc(keySafe(key)).set({ value: jsonString });
      return { value: jsonString };
    } catch (e) {
      console.error("dbSet failed for", key, e);
      return null;
    }
  };
</script>
