  function keySafe(key) {
    return key.replace(/:/g, "_");

  window.dbGet = async function (key) {
    const user = auth.currentUser;
    if (!user) return null;
    try {
      const snap = await db.collection("users").doc(user.uid).collection("data").doc(keySafe(key)).get();
